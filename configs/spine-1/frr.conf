! spine-1
frr defaults datacenter
hostname spine-1
log syslog informational
log timestamp precision 6
service integrated-vtysh-config
!
ip prefix-list PL-LOOPBACKS-SPINE seq 10 permit 10.255.0.0/24 ge 32
!
route-map RM-CONNECTED permit 10
 match ip address prefix-list PL-LOOPBACKS-SPINE
!
route-map RM-SET-SRC permit 10
 set src 10.255.0.1
exit
!
ip protocol bgp route-map RM-SET-SRC
!
router bgp 65100
 bgp router-id 10.255.0.1
 no bgp default ipv4-unicast
 bgp cluster-id 10.255.0.100
 bgp bestpath as-path multipath-relax
 neighbor UNDERLAY peer-group
 neighbor 10.0.1.1 remote-as 65101
 neighbor 10.0.1.1 description leaf-1
 neighbor 10.0.1.1 peer-group UNDERLAY
 neighbor 10.0.1.3 remote-as 65102
 neighbor 10.0.1.3 description leaf-2
 neighbor 10.0.1.3 peer-group UNDERLAY
 neighbor 10.0.1.5 remote-as 65103
 neighbor 10.0.1.5 description leaf-3
 neighbor 10.0.1.5 peer-group UNDERLAY
 neighbor 10.0.1.7 remote-as 65104
 neighbor 10.0.1.7 description leaf-4
 neighbor 10.0.1.7 peer-group UNDERLAY
 !
 neighbor OVERLAY peer-group
 neighbor OVERLAY remote-as 65000
 neighbor OVERLAY local-as 65000 no-prepend replace-as
 neighbor OVERLAY update-source lo
 neighbor 10.255.1.1 peer-group OVERLAY
 neighbor 10.255.1.1 description leaf-1-lo
 neighbor 10.255.1.2 peer-group OVERLAY
 neighbor 10.255.1.2 description leaf-2-lo
 neighbor 10.255.1.3 peer-group OVERLAY
 neighbor 10.255.1.3 description leaf-3-lo
 neighbor 10.255.1.4 peer-group OVERLAY
 neighbor 10.255.1.4 description leaf-4-lo
 !
 address-family ipv4 unicast
  redistribute connected route-map RM-CONNECTED
  neighbor UNDERLAY activate
  maximum-paths 8
 exit-address-family
 !
 address-family l2vpn evpn
  neighbor OVERLAY activate
  neighbor OVERLAY route-reflector-client
 exit-address-family
!
