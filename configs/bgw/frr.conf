! bgw — border gateway
frr defaults datacenter
hostname bgw
log syslog informational
service integrated-vtysh-config
!
router bgp 65200 vrf INET-CL1
 bgp router-id 172.16.1.1
 no bgp ebgp-requires-policy
 neighbor 172.16.1.0 remote-as 65101
 neighbor 172.16.1.0 description leaf-1/VRF-CL1
 address-family ipv4 unicast
  redistribute connected
  neighbor 172.16.1.0 default-originate
 exit-address-family
exit
!
router bgp 65200 vrf INET-CL2
 bgp router-id 172.16.2.1
 no bgp ebgp-requires-policy
 neighbor 172.16.2.0 remote-as 65101
 neighbor 172.16.2.0 description leaf-1/VRF-CL2
 address-family ipv4 unicast
  redistribute connected
  neighbor 172.16.2.0 default-originate
 exit-address-family
exit
!
