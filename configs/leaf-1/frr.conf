! leaf-1
frr defaults datacenter
hostname leaf-1
log syslog informational
log timestamp precision 6
service integrated-vtysh-config
!
vrf VRF-CL1
 vni 4001
exit-vrf
!
vrf VRF-CL2
 vni 4002
exit-vrf
!
interface bond1
 evpn mh es-df-pref 50000
 evpn mh es-id 1
 evpn mh es-sys-mac 44:38:39:ff:00:01
exit
!
interface swp1
 evpn mh uplink
exit
!
interface swp2
 evpn mh uplink
exit
!
ip prefix-list PL-LOOPBACKS seq 10 permit 10.255.1.0/24 ge 32
!
route-map RM-CONNECTED permit 10
 match ip address prefix-list PL-LOOPBACKS
exit
!
ip prefix-list PL-BGW-IN seq 10 permit 0.0.0.0/0
ip prefix-list PL-BGW-IN seq 20 permit 1.1.1.0/24 le 32
ip prefix-list PL-BGW-IN seq 30 permit 2.2.2.0/24 le 32
ip prefix-list PL-BGW-OUT seq 10 permit 10.10.0.0/16 ge 24 le 24
!
route-map RM-BGW-IN permit 10
 match ip address prefix-list PL-BGW-IN
exit
!
route-map RM-BGW-OUT permit 10
 match ip address prefix-list PL-BGW-OUT
exit
!
route-map RM-SET-SRC permit 10
 set src 10.255.1.1
exit
!
ip protocol bgp route-map RM-SET-SRC
!
router bgp 65101
 bgp router-id 10.255.1.1
 no bgp default ipv4-unicast
 bgp bestpath as-path multipath-relax
 neighbor UNDERLAY peer-group
 neighbor UNDERLAY bfd 3 300 300
 neighbor 10.0.1.0 remote-as 65100
 neighbor 10.0.1.0 description spine-1
 neighbor 10.0.1.0 peer-group UNDERLAY
 neighbor 10.0.2.0 remote-as 65100
 neighbor 10.0.2.0 description spine-2
 neighbor 10.0.2.0 peer-group UNDERLAY
 !
 neighbor OVERLAY peer-group
 neighbor OVERLAY remote-as 65000
 neighbor OVERLAY local-as 65000 no-prepend replace-as
 neighbor OVERLAY update-source lo
 neighbor 10.255.0.1 peer-group OVERLAY
 neighbor 10.255.0.1 description spine-1-lo
 neighbor 10.255.0.2 peer-group OVERLAY
 neighbor 10.255.0.2 description spine-2-lo
 !
 address-family ipv4 unicast
  redistribute connected route-map RM-CONNECTED
  neighbor UNDERLAY activate
  maximum-paths 8
 exit-address-family
 !
 address-family l2vpn evpn
  neighbor OVERLAY activate
  advertise-all-vni
  vni 10010
   route-target import 65000:10010
   route-target export 65000:10010
  exit-vni
  vni 10020
   route-target import 65000:10020
   route-target export 65000:10020
  exit-vni
  vni 10110
   route-target import 65000:10110
   route-target export 65000:10110
  exit-vni
  vni 10120
   route-target import 65000:10120
   route-target export 65000:10120
  exit-vni
 exit-address-family
 !
exit
!
router bgp 65101 vrf VRF-CL1
 bgp router-id 10.255.1.1
 neighbor 172.16.1.1 remote-as 65200
 neighbor 172.16.1.1 description bgw/VRF-CL1
 !
 address-family ipv4 unicast
  redistribute connected
  neighbor 172.16.1.1 route-map RM-BGW-IN in
  neighbor 172.16.1.1 route-map RM-BGW-OUT out
 exit-address-family
 !
 address-family l2vpn evpn
  advertise ipv4 unicast
  route-target import 65000:4001
  route-target export 65000:4001
 exit-address-family
exit
!
router bgp 65101 vrf VRF-CL2
 bgp router-id 10.255.1.1
 neighbor 172.16.2.1 remote-as 65200
 neighbor 172.16.2.1 description bgw/VRF-CL2
 !
 address-family ipv4 unicast
  redistribute connected
  neighbor 172.16.2.1 route-map RM-BGW-IN in
  neighbor 172.16.2.1 route-map RM-BGW-OUT out
 exit-address-family
 !
 address-family l2vpn evpn
  advertise ipv4 unicast
  route-target import 65000:4002
  route-target export 65000:4002
 exit-address-family
exit
!
