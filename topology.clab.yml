name: evpn

mgmt:
  network: clab-oob
  ipv4-subnet: 172.20.20.0/24

topology:
  kinds:
    nvidia_cumulusvx:
      image: vrnetlab/nvidia_cumulus-vx:5.12.1
      env: {QEMU_MEMORY: 2048}
    linux:
      image: nicolaka/netshoot:v0.13

  nodes:
    spine-1: {kind: nvidia_cumulusvx, mgmt-ipv4: 172.20.20.11}
    spine-2: {kind: nvidia_cumulusvx, mgmt-ipv4: 172.20.20.12}
    leaf-1:  {kind: nvidia_cumulusvx, mgmt-ipv4: 172.20.20.21}
    leaf-2:  {kind: nvidia_cumulusvx, mgmt-ipv4: 172.20.20.22}
    leaf-3:  {kind: nvidia_cumulusvx, mgmt-ipv4: 172.20.20.23}
    leaf-4:  {kind: nvidia_cumulusvx, mgmt-ipv4: 172.20.20.24}

    bgw:
      kind: linux
      image: quay.io/frrouting/frr:10.2.1
      mgmt-ipv4: 172.20.20.31
      binds:
        - configs/bgw/daemons:/etc/frr/daemons
        - configs/bgw/frr.conf:/etc/frr/frr.conf
        - configs/bgw/vtysh.conf:/etc/frr/vtysh.conf
        - configs/bgw/setup.sh:/setup.sh
      exec:
        - sh /setup.sh

    # clients
    cl1-h1: {kind: linux, mgmt-ipv4: 172.20.20.100, binds: [configs/cl1-h1/setup.sh:/setup.sh], exec: [sh /setup.sh]}
    cl1-h2: {kind: linux, mgmt-ipv4: 172.20.20.101, binds: [configs/cl1-h2/setup.sh:/setup.sh], exec: [sh /setup.sh]}
    cl1-h3: {kind: linux, mgmt-ipv4: 172.20.20.102, binds: [configs/cl1-h3/setup.sh:/setup.sh], exec: [sh /setup.sh]}
    cl1-h4: {kind: linux, mgmt-ipv4: 172.20.20.103, binds: [configs/cl1-h4/setup.sh:/setup.sh], exec: [sh /setup.sh]}
    cl2-h1: {kind: linux, mgmt-ipv4: 172.20.20.110, binds: [configs/cl2-h1/setup.sh:/setup.sh], exec: [sh /setup.sh]}
    cl2-h2: {kind: linux, mgmt-ipv4: 172.20.20.111, binds: [configs/cl2-h2/setup.sh:/setup.sh], exec: [sh /setup.sh]}
    cl2-h3: {kind: linux, mgmt-ipv4: 172.20.20.112, binds: [configs/cl2-h3/setup.sh:/setup.sh], exec: [sh /setup.sh]}
    cl2-h4: {kind: linux, mgmt-ipv4: 172.20.20.113, binds: [configs/cl2-h4/setup.sh:/setup.sh], exec: [sh /setup.sh]}

  links:
    # spine-1
    - endpoints: ["spine-1:swp1", "leaf-1:swp1"]
    - endpoints: ["spine-1:swp2", "leaf-2:swp1"]
    - endpoints: ["spine-1:swp3", "leaf-3:swp1"]
    - endpoints: ["spine-1:swp4", "leaf-4:swp1"]
    # spine-2
    - endpoints: ["spine-2:swp1", "leaf-1:swp2"]
    - endpoints: ["spine-2:swp2", "leaf-2:swp2"]
    - endpoints: ["spine-2:swp3", "leaf-3:swp2"]
    - endpoints: ["spine-2:swp4", "leaf-4:swp2"]
    # malg peerlink leaf-3 <> leaf-4 
    - endpoints: ["leaf-3:swp10", "leaf-4:swp10"]
    - endpoints: ["leaf-3:swp11", "leaf-4:swp11"]
    # clinets
    ## 1 segment vlan10
    - endpoints: ["leaf-1:swp3", "cl1-h1:eth1"]
    - endpoints: ["leaf-3:swp3", "cl1-h3:eth1"]
    ## 2 segment vlan 20 (mh/mlag)
    - endpoints: ["leaf-1:swp4", "cl1-h2:eth1"]   # mh
    - endpoints: ["leaf-2:swp4", "cl1-h2:eth2"]   # mh
    - endpoints: ["leaf-3:swp4", "cl1-h4:eth1"]   # malg
    - endpoints: ["leaf-4:swp4", "cl1-h4:eth2"]   # mlag
    ## 3 segment vlan 110
    - endpoints: ["leaf-1:swp5", "cl2-h1:eth1"]
    - endpoints: ["leaf-3:swp5", "cl2-h3:eth1"]
    ## 4 segment vlan 120
    - endpoints: ["leaf-2:swp5", "cl2-h2:eth1"]
    - endpoints: ["leaf-4:swp5", "cl2-h4:eth1"]
    ## border
    - endpoints: ["leaf-1:swp6", "bgw:eth1"]
